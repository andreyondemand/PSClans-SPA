<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self' https://ps99.biggamesapi.io https://psclans-spa.cloudflare-6apm0.workers.dev https://users.roproxy.com https://thumbnails.roproxy.com; form-action 'self'; img-src 'self' data: https:; object-src 'none'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pet Simulator Clans</title>
    <meta content="Pet Simulator Clans" property="og:title" />
    <meta
      content="Track your Pet Simulator clan with advanced member tracking"
      property="og:description"
    />
    <meta content="https://petsimulatorclans" property="og:url" />
    <meta
      content="./assets/images/clans.webp"
      property="og:image"
    />
    <meta content="#0066ff" name="theme-color" />
    <link
      rel="icon"
      type="image/x-icon"
      href="./assets/images/clans.webp"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"
      integrity="sha384-hjtEWSfxVipaKknyGUhJZbhSbbepyHXBQlM78R56XnihJKl1YPeepRjUWc3aMMHH"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/moment@2.30.1/moment.min.js"
      integrity="sha384-USAC6hjPkAFseeCu8uwen4DQN6SWnkiILAVc0YpMn9zQWGI7ClWd2HcCoPGWWxT1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@0.1.1/dist/chartjs-adapter-moment.min.js"
      integrity="sha384-6UnKNJH54wbUPT5gmb/LwfUhVC1HOY0rhT8pzkd8HckDGBPuCw6dc4NhIgEf5Tjo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@0.7.7/dist/chartjs-plugin-zoom.min.js"
      integrity="sha384-/8Dlz/HHZKwUuh9HZDV80gC+9mz8z95Iw8Np4VzOrudbL0KWUaxO+r1ZUItIIrAm"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="topbar">
      <a href="#/" class="brand-link" aria-label="Home">
        <img
          src="./assets/images/clans.webp"
          alt="Pet Simulator Clans Logo"
        />
      </a>
      <nav id="main-nav">
        <a href="#/" data-route="/">Home</a>
        <a href="#/clans" data-route="/clans">Clans</a>
        <a href="#/enchants" data-route="/enchants">Enchants</a>
        <a
          class="external-nav-link"
          href="https://github.com/andreyondemand/PSClans-SPA"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.2v3.3c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z" />
          </svg>
          GitHub
        </a>
        <a
          class="external-nav-link"
          href="https://discord.gg/wPhaR58pDp"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.2a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-5 1.4C.5 9.1-.4 13.7 0 18.2a20 20 0 0 0 6.1 3.1l1.5-2.1a13 13 0 0 1-2.3-1.1l.6-.5a14.2 14.2 0 0 0 12.2 0l.6.5a15 15 0 0 1-2.3 1.1l1.5 2.1a19.9 19.9 0 0 0 6.1-3.1c.5-5.2-.8-9.8-3.7-13.8ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.5s1-2.5 2.2-2.5 2.2 1.1 2.2 2.5-1 2.5-2.2 2.5Zm8 0c-1.2 0-2.2-1.1-2.2-2.5s1-2.5 2.2-2.5 2.2 1.1 2.2 2.5-1 2.5-2.2 2.5Z" />
          </svg>
          Discord
        </a>
      </nav>
    </header>

    <div class="message-extension hidden" id="topBar">petsimulatorclans</div>

    <main id="app" class="app-shell" aria-live="polite"></main>

    <div id="graph-popup" class="popup" aria-hidden="true">
      <button id="close-popup" class="close-btn" aria-label="Close">&times;</button>
      <div class="popup-content">
        <h3>User Information</h3>
        <div class="popup-meta">
          <p><strong>Username:</strong> <span id="popup-username"></span></p>
          <p><strong>User ID:</strong> <span id="popup-userid"></span></p>
          <p><strong>Joined:</strong> <span id="popup-joined"></span></p>
          <p>
            <strong
              ><img
                class="icon"
                src="./assets/images/gold_star_1_outline.png"
                alt="points"
              />
              Points:</strong
            >
            <span id="popup-points"></span>
          </p>
        </div>
        <div class="popup-controls">
          <label for="timeframeDropdown">Time Interval:</label>
          <select id="timeframeDropdown">
            <option value="minute">Minutes</option>
            <option value="hour">Hourly</option>
            <option value="day">Daily</option>
          </select>
          <span id="popup-history-status" class="status-info"></span>
          <button id="popup-load-older" type="button" class="button secondary-button hidden">Load older</button>
        </div>
        <div class="popup-chart-wrap">
          <canvas id="pointsGraph" width="800" height="400"></canvas>
        </div>
      </div>
    </div>

    <footer class="bottom-nav">
      <nav>
        <p>
          Information shown on Pet Simulator Clans is from the public Pet Simulator
          99 and Pets GO! APIs maintained by the BIG Games team.
          petsimulatorclans is not affiliated with BIG Games.
        </p>
      </nav>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
